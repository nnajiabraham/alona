name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The shared logic has no dependencies. The app's own checks need an Exact
      # checkout and a device or browser, so they run locally (see AGENTS.md).
      - name: Core tests
        run: bun test core/
