# SwiftLint Configuration for Alona
# https://github.com/realm/SwiftLint

# Paths to include
included:
  - Alona
  - AlonaTests

# Paths to exclude
excluded:
  - DerivedData
  - .build
  - .swiftpm
  - "**/*.generated.swift"
  - "**/Generated"
  - "**/Resources"

# Analyzer rules (require compilation)
analyzer_rules:
  - unused_declaration
  - unused_import

# Opt-in rules
opt_in_rules:
  # From CodexBar
  - array_init
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - switch_case_alignment
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  # Additional Alona rules
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_xctest_method
  - flatmap_over_map_reduce
  - identical_operands
  - legacy_multiple
  - lower_acl_than_parent
  - modifier_order
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - toggle_bool
  - yoda_condition

# Disabled rules
disabled_rules:
  # SwiftFormat handles these
  - trailing_whitespace
  - trailing_newline
  - trailing_comma
  - vertical_whitespace
  - indentation_width
  - sorted_imports
  - closure_end_indentation
  # Swift 6 requires explicit self - disable this rule
  - explicit_self
  # We use TODO comments during development
  - todo
  # Too restrictive or not applicable
  - identifier_name  # Configured below instead

# Rule configurations
line_length:
  warning: 120
  error: 250
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: true

function_body_length:
  warning: 150
  error: 300

file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

type_body_length:
  warning: 500
  error: 800

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 20
  error: 40

nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 4
    error: 6

type_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80

# Force cast/try configuration
force_cast: warning
force_try: warning

# Reporter type
reporter: "xcode"
